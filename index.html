    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dblclick', (e) => e.preventDefault());

        class SoundManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            playTap(stepIndex) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    // 100番まで可聴域（C4〜C6）に収まる音階ループ計算
                    const baseFreq = 261.63; // C4
                    const scale = [0, 2, 4, 5, 7, 9, 11, 12];
                    const octave = Math.floor((stepIndex % 24) / 8);
                    const noteInOctave = scale[stepIndex % 8];
                    const semitone = octave * 12 + noteInOctave;
                    const freq = baseFreq * Math.pow(2, semitone / 12);

                    const now = this.ctx.currentTime;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

                    osc.onended = () => {
                        try {
                            osc.disconnect();
                            gain.disconnect();
                        } catch(e) {}
                    };

                    osc.start(now);
                    osc.stop(now + 0.22);
                } catch (e) {
                    console.error(e);
                }
            }

            playFanfare() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }

                try {
                    const arpeggio = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    const now = this.ctx.currentTime;
                    arpeggio.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                        gain.gain.setValueAtTime(0.35, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.5);

                        osc.onended = () => {
                            try {
                                osc.disconnect();
                                gain.disconnect();
                            } catch(e) {}
                        };

                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.5);
                    });
                } catch (e) {
                    console.error(e);
                }
            }
        }

        class ConfettiManager {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.animating = false;
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            start() {
                this.resize();
                this.particles = [];
                const colors = ['#F43F5E', '#3B82F6', '#10B981', '#FBBF24', '#8B5CF6', '#EC4899'];
                for (let i = 0; i < 90; i++) {
                    this.particles.push({
                        x: this.canvas.width * 0.5,
                        y: this.canvas.height * 0.5,
                        vx: (Math.random() - 0.5) * 20,
                        vy: (Math.random() - 0.7) * 20,
                        size: Math.random() * 8 + 6,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.2,
                        opacity: 1
                    });
                }
                this.animating = true;
                this.loop();
            }

            stop() {
                this.animating = false;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            loop() {
                if (!this.animating) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                let alive = false;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.35;
                    p.vx *= 0.98;
                    p.rotation += p.vRot;
                    if (p.y > this.canvas.height * 0.65) p.opacity -= 0.02;

                    if (p.opacity > 0) {
                        alive = true;
                        this.ctx.save();
                        this.ctx.globalAlpha = Math.max(0, p.opacity);
                        this.ctx.translate(p.x, p.y);
                        this.ctx.rotate(p.rotation);
                        this.ctx.fillStyle = p.color;
                        this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        this.ctx.restore();
                    }
                });

                if (alive) requestAnimationFrame(() => this.loop());
                else this.animating = false;
            }
        }

        // Helper: 16:9画面で正円を維持する点の生成 (閉じた正円点群を生成)
        function createCirclePoints(cx, cy, rPercent, count, startAngle = -Math.PI / 2, endAngle = Math.PI * 1.5) {
            const pts = [];
            const aspect = 16 / 9;
            for (let i = 0; i <= count; i++) {
                const angle = startAngle + (endAngle - startAngle) * (i / count);
                pts.push({
                    x: Number((cx + rPercent * Math.cos(angle)).toFixed(1)),
                    y: Number((cy + rPercent * aspect * Math.sin(angle)).toFixed(1))
                });
            }
            return pts;
        }

        // 1. お菓子の家 (Candy House)

            const seg2 = [
                {x:25,y:42},{x:25,y:55},{x:25,y:68},{x:25,y:82},{x:42,y:82},

            const seg3 = [
                {x:42,y:82},{x:42,y:64},{x:44,y:58},{x:47,y:54},{x:50,y:53},{x:53,y:54},{x:56,y:58},{x:58,y:64},{x:58,y:82}
            ];
            const seg4 = [
                {x:30,y:54},{x:38,y:54},{x:38,y:66},{x:30,y:66},{x:30,y:54},{x:34,y:54},{x:34,y:66},{x:30,y:60}
            ];
            const seg5 = [
                {x:62,y:54},{x:70,y:54},{x:70,y:66},{x:62,y:66},{x:62,y:54},{x:66,y:54},{x:66,y:66},{x:62,y:60}
            ];
            const seg6 = [
                {x:65,y:28.5},{x:65,y:12},{x:73,y:12},{x:73,y:35.5},{x:65,y:12},{x:73,y:12},{x:69,y:12}
            ];
            const leftCircle = createCirclePoints(12, 35, 4.0, 9);
            const seg7 = [
                ...leftCircle,
                {x:12,y:43},{x:12,y:52},{x:12,y:62},{x:12,y:72},{x:12,y:82}
            ];
            const rightCircle = createCirclePoints(88, 48, 4.0, 9);
            const seg8 = [
                ...rightCircle,
                {x:88,y:56},{x:88,y:62},{x:88,y:68},{x:88,y:75},{x:88,y:82}
            ];

            const points = [...seg0, ...seg1, ...seg2, ...seg3, ...seg4, ...seg5, ...seg6, ...seg7, ...seg8];
            const segments = [
                [0, 14], [15, 27], [28, 37], [38, 46], [47, 54], [55, 62], [63, 69], [70, 84], [85, 99]
            ];

            return {
                points, segments,
                drawDetails: (ctx, w, h, alpha) => {
                    ctx.save();
                    ctx.globalAlpha = alpha;

                    ctx.fillStyle = '#fef3c7';
                    ctx.fillRect(0, h * 0.82, w, h * 0.18);

                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(w * 0.65, h * 0.12, w * 0.08, h * 0.235);

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(w * 0.69, h * 0.08, w * 0.022, 0, Math.PI * 2);
                    ctx.arc(w * 0.72, h * 0.05, w * 0.03, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(w * 0.25, h * 0.42, w * 0.50, h * 0.40);

                    ctx.fillStyle = '#ff4d6d';
                    ctx.beginPath();
                    ctx.moveTo(w * 0.20, h * 0.42);
                    ctx.lineTo(w * 0.50, h * 0.15);
                    ctx.lineTo(w * 0.80, h * 0.42);
                    ctx.closePath(); ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    for (let xR = 0.20; xR <= 0.80; xR += 0.05) {
                        ctx.arc(w * xR, h * 0.42, w * 0.025, 0, Math.PI);
                    }
                    ctx.fill();

                    ctx.fillStyle = '#3d1e03';
                    ctx.beginPath();
                    ctx.moveTo(w * 0.42, h * 0.82);
                    ctx.lineTo(w * 0.42, h * 0.64);
                    ctx.quadraticCurveTo(w * 0.50, h * 0.52, w * 0.58, h * 0.64);
                    ctx.lineTo(w * 0.58, h * 0.82);
                    ctx.closePath(); ctx.fill();

                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(w * 0.30, h * 0.54, w * 0.08, h * 0.12);
                    ctx.fillRect(w * 0.62, h * 0.54, w * 0.08, h * 0.12);

                    const aspect = 16 / 9;
                    const rX = w * 0.04;
                    const rY = rX * aspect;

                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(w * 0.11, h * 0.43, w * 0.02, h * 0.39);
                    ctx.fillStyle = '#ec4899';
                    ctx.beginPath(); ctx.ellipse(w * 0.12, h * 0.35, rX, rY, 0, 0, Math.PI * 2); ctx.fill();

                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(w * 0.87, h * 0.56, w * 0.02, h * 0.26);
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.ellipse(w * 0.88, h * 0.48, rX, rY, 0, 0, Math.PI * 2); ctx.fill();

                    ctx.restore();
                }
            };
        }

        // 7. ティラノサウルス (T-Rex)

            const armR = [
                // 57~62 (indices 56..61): 右の小さな前脚
                {x:36,y:42},{x:34,y:46},{x:30,y:48},{x:28,y:46},{x:30,y:48},{x:34,y:46}

            const armL = [
                // 63~68 (indices 62..67): 左の小さな前脚
                {x:38,y:44},{x:36,y:48},{x:32,y:50},{x:30,y:48},{x:32,y:50},{x:36,y:48}
            ];

            const eye = [
                // 69~76 (indices 68..75): 大きな目元
                {x:25,y:24},{x:27,y:22},{x:29,y:24},{x:27,y:26},{x:25,y:24},{x:27,y:23},{x:28,y:24},{x:27,y:25}
            ];

            const browNostril = [
                // 77~80 (indices 76..79): 凛々しい眉・鼻孔
                {x:23,y:20},{x:29,y:21},{x:18,y:28},{x:19,y:28}
            ];

            const backSpikes = [
                // 81~90 (indices 80..89): 背中の棘模様
                {x:42,y:25},{x:44,y:22},{x:46,y:26},{x:50,y:27},{x:52,y:24},{x:54,y:28},{x:60,y:29},{x:62,y:26},{x:64,y:30},{x:72,y:32}
            ];

            const clawsR = [
                // 91~95 (indices 90..94): 右足の足先と爪
                {x:34,y:78},{x:36,y:82},{x:38,y:78},{x:40,y:82},{x:42,y:78}
            ];

            const clawsL = [
                // 96~100 (indices 95..99): 左足の足先と爪 (100番の点を含む)
                {x:52,y:78},{x:54,y:82},{x:56,y:78},{x:58,y:82},{x:60,y:78}
            ];

            const points = [...outer, ...mouthTeeth, ...armR, ...armL, ...eye, ...browNostril, ...backSpikes, ...clawsR, ...clawsL];
            const segments = [
                [0, 36], [37, 39], [40, 55], [56, 61], [62, 67], [68, 75], [76, 77], [78, 79], [80, 89], [90, 94], [95, 99]
            ];

            return {
                points, segments,
                drawDetails: (ctx, w, h, alpha) => {
                    ctx.save();
                    ctx.globalAlpha = alpha;

                    // 地面の影
                    ctx.fillStyle = '#bbf7d0';
                    ctx.beginPath();
                    ctx.ellipse(w * 0.48, h * 0.79, w * 0.38, h * 0.06, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // メインボディ（外郭線座標を100%忠実にトレースし隙間ゼロ）
                    ctx.fillStyle = '#f95716';
                    ctx.beginPath();
                    for (let i = 0; i <= 36; i++) {
                        const px = (outer[i].x / 100) * w;
                        const py = (outer[i].y / 100) * h;
                        if (i === 0) ctx.moveTo(px, py);

                    ctx.closePath();
                    ctx.fill();

                    // お腹・顎のやわらかい黄色アクセント

                    const bellyIndices = [34, 35, 36, 33, 25, 24, 23, 16, 15, 14, 13];

                        const py = (outer[idx].y / 100) * h;
                        if (i === 0) ctx.moveTo(px, py);

                    ctx.quadraticCurveTo(w * 0.60, h * 0.48, (outer[34].x / 100) * w, (outer[34].y / 100) * h);

                    ctx.fill();

                    // 白い牙
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    for (let i = 0; i < mouthTeeth.length; i++) {
                        const px = (mouthTeeth[i].x / 100) * w;
                        const py = (mouthTeeth[i].y / 100) * h;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // 背中の棘
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    for (let i = 0; i < backSpikes.length; i++) {
                        const px = (backSpikes[i].x / 100) * w;
                        const py = (backSpikes[i].y / 100) * h;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // 足先の爪
                    ctx.fillStyle = '#facc15';
                    [clawsR, clawsL].forEach(claws => {
                        ctx.beginPath();
                        for (let i = 0; i < claws.length; i++) {
                            const px = (claws[i].x / 100) * w;
                            const py = (claws[i].y / 100) * h;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                        ctx.fill();
                    });

                    // 目元
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(w * 0.27, h * 0.24, w * 0.014, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(w * 0.266, h * 0.235, w * 0.005, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            };
        }

                this.currentIndex = 0;
                this.isCompleted = false;
                this.completionProgress = 0;
                this.isModalMinimized = false;

                this.hintLevel = 0;
                this.pulseTimer = 0;
                this.clearTimer = null;

                this.stageListContainer = document.getElementById('stage-list-container');
                this.counterDisplayEl = document.getElementById('counter-display');

                this.clearModalEl = document.getElementById('clear-modal');
                this.modalCardEl = document.getElementById('modal-card');
                this.modalFullContentEl = document.getElementById('modal-full-content');
                this.modalSubTextEl = document.getElementById('modal-sub-text');

                this.modalBtnGroupNormal = document.getElementById('modal-btn-group-normal');
                this.modalBtnGroupFinal = document.getElementById('modal-btn-group-final');

                this.btnModalViewNormal = document.getElementById('btn-modal-view-normal');
                this.btnModalViewFinal = document.getElementById('btn-modal-view-final');

                this.btnSoundEl = document.getElementById('btn-sound');
                this.soundIconEl = document.getElementById('sound-icon');
                this.btnResetEl = document.getElementById('btn-reset');

                this.init();
            }

            init() {
                this.renderStageButtons();
                this.setupHintControl();
                this.setupEventListeners();
                this.resizeCanvas();
                this.loadStage(0);

                this.animate();
            }

            renderStageButtons() {
                this.stageListContainer.innerHTML = '';
                STAGES_MASTER.forEach((stage, idx) => {
                    const btn = document.createElement('button');
                    btn.id = `stage-btn-${idx}`;
                    btn.className = `px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap transition-all shrink-0 ${
                        idx === this.currentStageIndex
                            ? 'bg-amber-400 text-slate-950 shadow-md scale-105'
                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                    }`;
                    btn.textContent = stage.name;
                    btn.addEventListener('click', () => {
                        this.sound.init();
                        this.loadStage(idx);
                    });
                    this.stageListContainer.appendChild(btn);
                });
            }

            updateStageButtonsUI() {
                STAGES_MASTER.forEach((_, idx) => {
                    const btn = document.getElementById(`stage-btn-${idx}`);
                    if (!btn) return;
                    if (idx === this.currentStageIndex) {
                        btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap transition-all shrink-0 bg-amber-400 text-slate-950 shadow-md scale-105';
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap transition-all shrink-0 bg-slate-800 text-slate-300 hover:bg-slate-700';
                    }
                });
            }

            setupHintControl() {
                [0, 1, 2].forEach(lvl => {
                    document.getElementById(`hint-btn-${lvl}`).addEventListener('click', () => {
                        this.hintLevel = lvl;
                        [0, 1, 2].forEach(l => {
                            const btn = document.getElementById(`hint-btn-${l}`);
                            if (l === lvl) btn.className = 'hint-seg-btn px-2 py-0.5 rounded-lg font-bold transition bg-slate-700 text-amber-300 shadow-sm border border-amber-500/50';
                            else btn.className = 'hint-seg-btn px-2 py-0.5 rounded-lg font-bold transition text-slate-400 hover:text-slate-200';
                        });
                    });
                });
            }

            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    this.confetti.resize();
                });

                window.addEventListener('pointerdown', () => {
                    if (this.sound) this.sound.init();
                }, { once: false });

                this.canvas.addEventListener('pointerdown', (e) => {
                    if (this.isCompleted) {
                        this.toggleModalView();
                        return;
                    }
                    this.handlePointerDown(e);
                });

                this.btnSoundEl.addEventListener('click', () => {
                    this.sound.muted = !this.sound.muted;
                    this.soundIconEl.textContent = this.sound.muted ? '🔇' : '🔊';
                });

                this.btnResetEl.addEventListener('click', () => {
                    this.sound.init();
                    this.loadStage(this.currentStageIndex);
                });

                this.btnModalViewNormal.addEventListener('click', () => this.toggleModalView());
                this.btnModalViewFinal.addEventListener('click', () => this.toggleModalView());

                document.getElementById('btn-modal-replay-normal').addEventListener('click', () => {
                    this.hideModal();
                    this.loadStage(this.currentStageIndex);
                });

                document.getElementById('btn-modal-next-normal').addEventListener('click', () => {
                    this.hideModal();
                    const nextIdx = (this.currentStageIndex + 1) % STAGES_MASTER.length;
                    this.loadStage(nextIdx);
                });

                document.getElementById('btn-restart-all').addEventListener('click', () => {
                    this.hideModal();
                    this.loadStage(0);
                });

                document.getElementById('btn-replay-last').addEventListener('click', () => {
                    this.hideModal();
                    this.loadStage(this.currentStageIndex);
                });
            }

            resizeCanvas() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            loadStage(index) {
                if (this.clearTimer) clearTimeout(this.clearTimer);
                this.currentStageIndex = index;
                this.currentIndex = 0;
                this.isCompleted = false;
                this.isModalMinimized = false;
                this.completionProgress = 0;

                this.counterDisplayEl.textContent = `0 / 100`;
                this.updateStageButtonsUI();
                this.hideModal();
                this.confetti.stop();
            }

            handlePointerDown(e) {
                if (this.isCompleted) return;

                const rect = this.canvas.getBoundingClientRect();
                const touchX = e.clientX - rect.left;
                const touchY = e.clientY - rect.top;

                const stage = STAGES_MASTER[this.currentStageIndex];
                if (this.currentIndex >= 100) return;

                const targetPt = stage.points[this.currentIndex];
                if (!targetPt) return;

                const targetPixelX = (targetPt.x / 100) * this.canvas.width;
                const targetPixelY = (targetPt.y / 100) * this.canvas.height;

                const distance = Math.hypot(touchX - targetPixelX, touchY - targetPixelY);
                
                // 点の正確なタップが必要となるようヒット範囲を厳密化
                const baseDotRadius = Math.max(5, this.canvas.width * 0.008);
                const hitRadius = Math.max(10, baseDotRadius * 1.3);

                if (distance <= hitRadius) {
                    this.sound.playTap(this.currentIndex);
                    this.currentIndex++;
                    this.counterDisplayEl.textContent = `${this.currentIndex} / 100`;

                    if (this.currentIndex >= 100) {
                        this.triggerCompletion();
                    }
                }
            }

            triggerCompletion() {
                this.isCompleted = true;
                this.sound.playFanfare();
                this.confetti.start();

                let startTime = null;
                const animateFill = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const elapsed = timestamp - startTime;
                    this.completionProgress = Math.min(1, elapsed / 800);

                    if (this.completionProgress < 1) requestAnimationFrame(animateFill);
                };
                requestAnimationFrame(animateFill);

                if (this.clearTimer) clearTimeout(this.clearTimer);
                this.clearTimer = setTimeout(() => {
                    this.showModalCentered();
                }, 3000);
            }

            toggleModalView() {
                if (this.isModalMinimized) {
                    this.showModalCentered();
                } else {
                    this.minimizeModal();
                }
            }

            showModalCentered() {
                this.isModalMinimized = false;
                const isFinal = (this.currentStageIndex === STAGES_MASTER.length - 1);
                const stage = STAGES_MASTER[this.currentStageIndex];

                if (isFinal) {
                    this.modalSubTextEl.textContent = `全9ステージをすべてクリア！すごい！`;
                    this.modalBtnGroupNormal.classList.add('hidden');
                    this.modalBtnGroupFinal.classList.remove('hidden');
                    this.modalBtnGroupFinal.classList.add('flex');
                } else {
                    this.modalSubTextEl.textContent = `${stage.name} かんせい！`;
                    this.modalBtnGroupNormal.classList.remove('hidden');
                    this.modalBtnGroupNormal.classList.add('flex');
                    this.modalBtnGroupFinal.classList.add('hidden');
                }

                this.clearModalEl.className = 'absolute inset-0 z-30 flex items-center justify-center transition-all duration-500 opacity-100 pointer-events-auto bg-slate-950/40 backdrop-blur-sm';
                this.modalCardEl.className = 'bg-slate-900/95 backdrop-blur-md rounded-3xl p-5 sm:p-6 max-w-md w-[92%] text-center shadow-2xl transition-all duration-500 transform scale-100 border-4 border-amber-400/90 text-slate-100';

                this.modalFullContentEl.style.display = 'block';
                this.modalBtnGroupNormal.className = 'flex flex-col sm:flex-row items-center justify-center gap-2';
                this.btnModalViewNormal.style.display = 'inline-flex';
                this.btnModalViewNormal.textContent = '👀 えをみる';
            }

            minimizeModal() {
                this.isModalMinimized = true;
                this.clearModalEl.className = 'absolute inset-0 z-30 flex items-end justify-end p-3 transition-all duration-500 opacity-100 pointer-events-none bg-transparent';
                this.modalCardEl.className = 'bg-slate-900/95 backdrop-blur-md rounded-2xl p-2 max-w-xs shadow-xl transition-all duration-500 border-2 border-amber-400/80 pointer-events-auto text-slate-100';
                
                this.modalFullContentEl.style.display = 'none';
                this.modalBtnGroupNormal.className = 'flex flex-row items-center justify-center gap-1.5';
                this.btnModalViewNormal.style.display = 'inline-flex';
                this.btnModalViewNormal.textContent = '👀 ダイアログ';
            }

            hideModal() {
                this.isModalMinimized = false;
                this.clearModalEl.className = 'absolute inset-0 z-30 flex items-center justify-center transition-all duration-500 opacity-0 pointer-events-none bg-transparent';
                this.modalCardEl.className = 'bg-slate-900/90 backdrop-blur-sm rounded-3xl p-5 sm:p-6 max-w-md w-[92%] text-center shadow-2xl transition-all duration-500 transform scale-90 border-4 border-amber-400/90 text-slate-100';
            }

            animate() {
                this.pulseTimer += 0.05;
                this.render();
                requestAnimationFrame(() => this.animate());
            }

            render() {
                const w = this.canvas.width;
                const h = this.canvas.height;
                const stage = STAGES_MASTER[this.currentStageIndex];

                this.ctx.clearRect(0, 0, w, h);

                const bgGrad = this.ctx.createLinearGradient(0, 0, w, h);
                bgGrad.addColorStop(0, stage.bgGradient[0]);
                bgGrad.addColorStop(0.5, stage.bgGradient[1]);
                bgGrad.addColorStop(1, stage.bgGradient[2]);
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, w, h);

                if (this.isCompleted && stage.drawDetails) {
                    this.ctx.save();
                    stage.drawDetails(this.ctx, w, h, this.completionProgress);
                    this.ctx.restore();
                }

                if (this.currentIndex > 0) {
                    this.ctx.save();
                    if (this.isCompleted) {
                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.lineWidth = Math.max(3, w * 0.004);
                    } else {
                        this.ctx.strokeStyle = '#0284c7';
                        this.ctx.lineWidth = Math.max(3, w * 0.005);
                    }
                    this.ctx.lineCap = 'round';
                    this.ctx.lineJoin = 'round';

                    stage.segments.forEach(([segStart, segEnd]) => {
                        if (this.currentIndex <= segStart) return;

                        const endIdx = Math.min(this.currentIndex - 1, segEnd);
                        this.ctx.beginPath();
                        for (let i = segStart; i <= endIdx; i++) {
                            const pt = stage.points[i];
                            if (!pt) continue;
                            const px = (pt.x / 100) * w;
                            const py = (pt.y / 100) * h;
                            if (i === segStart) this.ctx.moveTo(px, py);
                            else this.ctx.lineTo(px, py);
                        }
                        this.ctx.stroke();
                    });
                    this.ctx.restore();
                }

                if (!this.isCompleted) {
                    const baseDotRadius = Math.max(5, w * 0.008);

                    // 現在のターゲット点の位置情報を取得
                    const targetIdx = this.currentIndex;
                    const targetPt = stage.points[targetIdx];
                    let targetPx = 0, targetPy = 0;
                    if (targetPt) {
                        targetPx = (targetPt.x / 100) * w;
                        targetPy = (targetPt.y / 100) * h;
                    }

                    for (let i = 0; i < 100; i++) {
                        if (i === this.currentIndex) continue;

                        const pt = stage.points[i];
                        if (!pt) continue;
                        const px = (pt.x / 100) * w;
                        const py = (pt.y / 100) * h;
                        const isPassed = i < this.currentIndex;

                        const dotColor = isPassed ? '#10B981' : '#38BDF8';
                        this.ctx.save();
                        this.ctx.beginPath();
                        this.ctx.arc(px, py, baseDotRadius, 0, Math.PI * 2);
                        this.ctx.fillStyle = dotColor;
                        this.ctx.fill();

                        this.ctx.strokeStyle = '#FFFFFF';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.stroke();

                        let showLabel = isPassed || (i % 10 === 0) || Math.abs(i - this.currentIndex) <= 2;

                        // これからタップするターゲット番号と他の数字（11, 21, 31...等）の位置が接近・重複している場合、タップ完了まで非表示化
                        if (showLabel && !isPassed && targetPt) {
                            const targetRenderRadius = (this.hintLevel >= 1) ? baseDotRadius * 1.5 : baseDotRadius;
                            const targetLabelY = targetPy - targetRenderRadius - 8;
                            const currentLabelY = py - baseDotRadius - 8;

                            const distDot = Math.hypot(px - targetPx, py - targetPy);
                            const distLabel = Math.hypot(px - targetPx, currentLabelY - targetLabelY);

                            if (distDot < 45 || distLabel < 40) {
                                showLabel = false;
                            }
                        }

                        if (showLabel) {
                            this.ctx.fillStyle = isPassed ? '#10B981' : '#FFFFFF';
                            this.ctx.font = `900 ${Math.max(10, baseDotRadius * 1.6)}px 'M PLUS Rounded 1c', sans-serif`;
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';

                            this.ctx.strokeStyle = '#0F172A';
                            this.ctx.lineWidth = 3;
                            const numberY = py - baseDotRadius - 8;
                            this.ctx.strokeText(`${i + 1}`, px, numberY);
                            this.ctx.fillText(`${i + 1}`, px, numberY);
                        }
                        this.ctx.restore();
                    }

                    if (this.currentIndex < 100) {
                        const targetIdx = this.currentIndex;
                        const pt = stage.points[targetIdx];
                        if (pt) {
                            const px = (pt.x / 100) * w;
                            const py = (pt.y / 100) * h;

                            let dotColor = '#38BDF8';
                            let textColor = '#FFFFFF';
                            let renderRadius = baseDotRadius;
                            let fontScale = 1.6;

                            if (this.hintLevel >= 1) {
                                dotColor = '#F59E0B';
                                textColor = '#FDE047';
                                fontScale = 2.2;
                                renderRadius = baseDotRadius * 1.5;
                            }

                            if (this.hintLevel === 2) {
                                renderRadius = baseDotRadius * (1.5 + Math.sin(this.pulseTimer * 4) * 0.2);

                                this.ctx.save();
                                const ringRadius = baseDotRadius * (2.4 + Math.sin(this.pulseTimer * 4) * 0.6);
                                this.ctx.strokeStyle = '#FDE047';
                                this.ctx.lineWidth = 3;
                                this.ctx.globalAlpha = 0.8 - Math.sin(this.pulseTimer * 4) * 0.3;
                                this.ctx.beginPath();
                                this.ctx.arc(px, py, ringRadius, 0, Math.PI * 2);
                                this.ctx.stroke();
                                this.ctx.restore();
                            }

                            this.ctx.save();
                            this.ctx.beginPath();
                            this.ctx.arc(px, py, renderRadius, 0, Math.PI * 2);
                            this.ctx.fillStyle = dotColor;
                            this.ctx.fill();

                            this.ctx.strokeStyle = '#FFFFFF';
                            this.ctx.lineWidth = 2.0;
                            this.ctx.stroke();

                            this.ctx.fillStyle = textColor;
                            this.ctx.font = `900 ${Math.max(10, renderRadius * fontScale)}px 'M PLUS Rounded 1c', sans-serif`;
                            this.ctx.textAlign = 'center';
                            this.ctx.textBaseline = 'middle';

                            const numberY = py - renderRadius - 8;
                            this.ctx.strokeStyle = '#000000';
                            this.ctx.lineWidth = 3.5;
                            this.ctx.strokeText(`${targetIdx + 1}`, px, numberY);
                            this.ctx.fillText(`${targetIdx + 1}`, px, numberY);
                            this.ctx.restore();
                        }
                    }
                }
            }
        }

        window.addEventListener('load', () => {
            new DotGame();
        });
    </script>
</body>
